# The judgement half of the daily refresh, carried to a pull request.
#
# atlas-refresh.yml deliberately cannot touch news.json, policy.json, regs.json
# or disputed.json, because a job that edits them on a timer is inventing the
# argument the page makes. That rule is about unattended authorship, not about
# mechanism. This workflow is dispatched by a session that has already done the
# judgement pass, and it carries that session's edits as a payload. Nothing here
# decides anything: tools/atlas/apply_judgement.py checks every record against
# the shape already in the file, enforces Test 2 of the admission policy, and
# refuses anything outside those four files.
#
# It merges its own pull request once ci.yml is green, the same way
# atlas-refresh.yml does, and then dispatches the deploy. The checkpoint that
# matters was never a human glance at a 350 KB generated diff: it is
# apply_judgement.py, which writes only those four files, caps a run at eight
# edits and enforces Test 2 on anything admitted as an anchor, plus ci.yml and
# the anchor-residual check below. All three run before the merge, and any one
# of them failing leaves main untouched and the work sitting in an open PR.
#
# Consequence worth knowing: there is no "open it, but wait for me" path any
# more. A dispatched payload lands. A session that is not sure of an edit should
# not dispatch it at all, and should say why in its run notes instead.
#
# Anything that moves a fitted number - calib.json, override.json, newload.json,
# sites.py - is out of scope on purpose. Re-deriving a factor needs arithmetic in
# a commit message and a person reading it.
name: Atlas judgement pass

on:
  workflow_dispatch:
    inputs:
      payload:
        description: 'JSON: news / regs / policy / disputed edits'
        required: true
        type: string
      note:
        description: 'Commit subject, e.g. "record Pennsylvania''s large-load model tariff"'
        required: true
        type: string
      dry_run:
        description: 'Validate and rebuild, open nothing'
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write
  # Needed to dispatch deploy.yml after the merge. See "Republish the site".
  actions: write

# Shares the refresh's group so the two can never rewrite the same files at once.
concurrency:
  group: atlas-refresh
  cancel-in-progress: false

jobs:
  judgement:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          token: ${{ secrets.ATLAS_BOT_TOKEN }}

      - name: Check the bot token is present
        run: |
          if [ -z "${{ secrets.ATLAS_BOT_TOKEN }}" ]; then
            echo "ATLAS_BOT_TOKEN is not set. Without it this job can open a pull"
            echo "request but never gets CI on it. Settings > Secrets and variables."
            exit 1
          fi

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      # The payload arrives through the environment, never interpolated into a
      # shell line: it is attacker-shaped input by construction, and ${{ }} in a
      # run block would be a command injection.
      - name: Take the payload
        env:
          PAYLOAD: ${{ inputs.payload }}
        run: |
          printf '%s' "$PAYLOAD" > /tmp/payload.json
          echo "payload bytes: $(wc -c < /tmp/payload.json)"
          python3 -m json.tool /tmp/payload.json > /tmp/payload.pretty.json
          cat /tmp/payload.pretty.json

      # The gate is the whole justification for this workflow existing, so it is
      # tested before it is trusted, every run.
      - name: Test the gate
        run: python3 tools/atlas/test_apply_judgement.py

      - name: Validate the payload
        run: python3 tools/atlas/apply_judgement.py --payload /tmp/payload.json --check

      - name: Apply it
        run: python3 tools/atlas/apply_judgement.py --payload /tmp/payload.json

      # Nothing outside the four ledger files may have moved. If something did,
      # the applier is not doing what it says and the run stops here.
      - name: Nothing else may have changed
        run: |
          allowed='^(tools/atlas/build/(news|policy|regs|disputed)\.json)$'
          bad=$(git status --porcelain | awk '{print $2}' | grep -Ev "$allowed" || true)
          if [ -n "$bad" ]; then
            echo "Unexpected changes outside the ledger files:"; echo "$bad"; exit 1
          fi
          git --no-pager diff --stat

      - name: Rebuild the page
        run: |
          ./tools/atlas/refresh.sh
          python3 tools/atlas/artifact.py

      # Same check the refresh runs. A ledger edit should not move an anchor; if
      # one drifts, something was admitted that should not have been.
      - name: Verify anchor residuals
        run: |
          python3 - <<'PY'
          import json, re, sys
          app = open('tools/atlas/parts/app.js', encoding='utf-8').read()
          k = {'iea': float(re.search(r'kIea\s*:\s*([0-9.]+)', app).group(1)),
               'metro': float(re.search(r'kNat\s*:\s*([0-9.]+)', app).group(1))}
          bad = []
          for a in json.load(open('tools/atlas/build/calib.json', encoding='utf-8'))['anchors']:
              model = a['cap'] * 8760 * k[a['basis']] / 1e6
              d = (model - a['meas']) / a['meas'] * 100
              flag = '' if abs(d) <= 5 or a['place'] == 'France' else '  OUT OF BAND'
              print(f"{a['place']:<16}{d:+6.2f}%{flag}")
              if flag:
                  bad.append(f"{a['place']} {d:+.2f}%")
          if bad:
              sys.exit('Anchor drift: ' + ', '.join(bad) + ' - re-derive the factor, do not ignore the anchor.')
          PY

      - name: Stop here if this was a dry run
        if: inputs.dry_run
        run: |
          git --no-pager diff --stat
          echo "dry run: validated and rebuilt, opening nothing."

      # The commit message carries the payload verbatim. The ledger is the
      # argument, so the argument travels with the edit rather than living in a
      # chat log that expires.
      - name: Open a pull request
        id: pr
        if: ${{ !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ secrets.ATLAS_BOT_TOKEN }}
          NOTE: ${{ inputs.note }}
        run: |
          if git diff --quiet -- tools/atlas public/datacenters; then
            echo "nothing to commit"; exit 1
          fi
          {
            printf 'Atlas: %s\n\n' "$NOTE"
            printf 'Judgement pass, dispatched by @%s.\n\n' "${{ github.actor }}"
            printf 'Payload applied (tools/atlas/apply_judgement.py):\n\n'
            sed 's/^/    /' /tmp/payload.pretty.json
            printf '\nRun: %s/%s/actions/runs/%s\n' \
              "${{ github.server_url }}" "${{ github.repository }}" "${{ github.run_id }}"
          } > /tmp/msg
          cat /tmp/msg
          branch="atlas-judge/$(date -u +%Y%m%d-%H%M)"
          git config user.name  'Ashley Cho'
          git config user.email 'ashleyeuncho@gmail.com'
          git switch -c "$branch"
          git add -A -- tools/atlas public/datacenters
          git commit -F /tmp/msg
          git push -u origin "$branch"
          url=$(gh pr create --base main --head "$branch" \
                  --title "$(head -1 /tmp/msg)" --body-file /tmp/msg)
          echo "$url"
          echo "number=${url##*/}" >> "$GITHUB_OUTPUT"
          echo "branch=$branch"    >> "$GITHUB_OUTPUT"

      # Wait for ci.yml rather than merging blind, exactly as atlas-refresh.yml
      # does. If the site stops building or a link breaks, the edits stay in the
      # PR and main is untouched - the page then goes stale honestly, which is
      # the failure mode we want. Skipped on a dry run, because the step above
      # never ran and so set no number.
      - name: Wait for CI, then merge
        id: merge
        if: steps.pr.outputs.number
        env:
          GH_TOKEN: ${{ secrets.ATLAS_BOT_TOKEN }}
        run: |
          n="${{ steps.pr.outputs.number }}"
          # ci.yml registers its check a few seconds after the PR opens. If
          # `gh pr checks` looks first it exits 1 on "no checks reported".
          # Wait up to five minutes for a check to appear before watching.
          for i in $(seq 1 30); do
            c=$(gh pr checks "$n" --json name --jq 'length' 2>/dev/null || true)
            if [ -n "$c" ] && [ "$c" != "0" ]; then break; fi
            sleep 10
          done
          gh pr checks "$n" --watch --interval 10 --fail-fast
          gh pr merge "$n" --merge --delete-branch
          echo "merged=true" >> "$GITHUB_OUTPUT"

      # A merge made with GITHUB_TOKEN does NOT trigger deploy.yml's `on: push`
      # - GitHub suppresses it to stop workflows recursing. Without this step the
      # commit lands on main, the run goes green, and the published page never
      # changes. workflow_dispatch is the documented exception to that rule.
      - name: Republish the site
        if: steps.merge.outputs.merged == 'true'
        env:
          GH_TOKEN: ${{ secrets.ATLAS_BOT_TOKEN }}
        run: gh workflow run deploy.yml --ref main
