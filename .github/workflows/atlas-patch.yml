# A push path for a session that has no git credentials.
#
# The daily judgement pass (atlas-judgement.yml) can only touch the four ledger
# JSON files, by design: a job editing calib.json or sites.py on a timer would be
# inventing the argument the page makes. Everything else - check_sources.py, the
# workflows, build.py - has had to wait for a human to run `git push`, because
# the sandbox a session works in holds no credential and the Terminal on the
# machine it is linked to cannot be typed into. On Nov 2, 2026 that left a
# tested two-commit fix sitting on a local branch for want of one command.
#
# This closes that gap without widening anyone's access. workflow_dispatch is
# already restricted to accounts with write permission on the repository, so
# whoever can run this could have pushed the same change directly. What it adds
# is a route that goes through CI and a pull request rather than straight to
# main - and like the judgement pass, it stops at the pull request and holds no
# permission to merge. The diff gets looked at by someone before it reaches the
# public page. That is the one checkpoint worth keeping.
name: Atlas patch

on:
  workflow_dispatch:
    inputs:
      patch_b64:
        description: 'base64 of a unified diff (git format-patch / git diff)'
        required: true
        type: string
      note:
        description: 'Commit subject, e.g. "retry gh pr merge in the daily refresh"'
        required: true
        type: string
      dry_run:
        description: 'Apply, test and rebuild, open nothing'
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write

# Shares the refresh's group so this can never rewrite the same files while the
# daily refresh or the judgement pass is mid-run.
concurrency:
  group: atlas-refresh
  cancel-in-progress: false

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          token: ${{ secrets.ATLAS_BOT_TOKEN }}

      - name: Check the bot token is present
        run: |
          if [ -z "${{ secrets.ATLAS_BOT_TOKEN }}" ]; then
            echo "ATLAS_BOT_TOKEN is not set. Without it this job can open a pull"
            echo "request but never gets CI on it. Settings > Secrets and variables."
            exit 1
          fi

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      # base64 rather than the diff itself, because a workflow_dispatch form
      # field is no place to trust whitespace: a unified diff is defined by its
      # leading spaces and its trailing newline, and both are exactly what a
      # round trip through a web form is liable to eat.
      #
      # The payload arrives through the environment, never interpolated into a
      # shell line: it is attacker-shaped input by construction, and ${{ }} in a
      # run block would be a command injection.
      - name: Decode the patch
        env:
          PATCH_B64: ${{ inputs.patch_b64 }}
        run: |
          printf '%s' "$PATCH_B64" | base64 -d > /tmp/patch.diff
          echo "patch bytes: $(wc -c < /tmp/patch.diff)"
          if [ ! -s /tmp/patch.diff ]; then
            echo "empty patch; nothing to do"; exit 1
          fi
          echo '--- patch ---'
          cat /tmp/patch.diff

      # Check before applying, so a patch cut against a different base fails
      # here with a readable message instead of half-applying.
      - name: Apply it
        run: |
          git apply --check --verbose /tmp/patch.diff
          git apply /tmp/patch.diff
          git --no-pager diff --stat

      - name: Say what it touched
        id: touched
        run: |
          files=$(git diff --name-only)
          echo "$files"
          { echo 'files<<EOF'; echo "$files"; echo 'EOF'; } >> "$GITHUB_OUTPUT"
          if echo "$files" | grep -q '^\.github/'; then
            echo "::warning::This patch changes CI configuration. Read that part of the diff first."
          fi
          if echo "$files" | grep -qE '^tools/atlas/build/(calib|override|newload)\.json$|^tools/atlas/build/sites\.py$'; then
            echo "::warning::This patch moves a fitted input (calib/override/newload/sites). The anchor arithmetic belongs in the commit message."
          fi

      # The test suites exist because both halves of this pipeline have shipped
      # bugs that only a pinned case would have caught. Run them whenever the
      # patch is anywhere near them.
      - name: Test
        # FILES comes from `git diff --name-only`, so a patch could name a file
        # anything it likes. Through `env:` that is a string; interpolated into
        # the shell line below it would be a command.
        env:
          FILES: ${{ steps.touched.outputs.files }}
        run: |
          if printf '%s' "$FILES" | grep -q '^tools/atlas/'; then
            python3 tools/atlas/test_check_sources.py
            python3 tools/atlas/test_apply_judgement.py
          else
            echo "nothing under tools/atlas changed; suites not run"
          fi

      # Same check the refresh and the judgement pass run. A code change that
      # moves an anchor is not necessarily wrong, but it must not go unnoticed.
      - name: Rebuild and verify anchor residuals
        run: |
          ./tools/atlas/refresh.sh
          python3 tools/atlas/artifact.py
          python3 - <<'PY'
          import json, re, sys
          app = open('tools/atlas/parts/app.js', encoding='utf-8').read()
          k = {'iea': float(re.search(r'kIea\s*:\s*([0-9.]+)', app).group(1)),
               'metro': float(re.search(r'kNat\s*:\s*([0-9.]+)', app).group(1))}
          bad = []
          for a in json.load(open('tools/atlas/build/calib.json', encoding='utf-8'))['anchors']:
              model = a['cap'] * 8760 * k[a['basis']] / 1e6
              d = (model - a['meas']) / a['meas'] * 100
              flag = '' if abs(d) <= 5 or a['place'] == 'France' else '  OUT OF BAND'
              print(f"{a['place']:<16}{d:+6.2f}%{flag}")
              if flag:
                  bad.append(f"{a['place']} {d:+.2f}%")
          if bad:
              sys.exit('Anchor drift: ' + ', '.join(bad) + ' - re-derive the factor, do not ignore the anchor.')
          PY

      - name: Stop here if this was a dry run
        if: inputs.dry_run
        run: |
          git --no-pager diff --stat
          echo "dry run: applied, tested and rebuilt, opening nothing."

      - name: Open a pull request
        if: ${{ !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ secrets.ATLAS_BOT_TOKEN }}
          NOTE: ${{ inputs.note }}
        run: |
          if git diff --quiet; then
            echo "nothing to commit"; exit 1
          fi
          {
            printf 'Atlas: %s\n\n' "$NOTE"
            printf 'Patch applied by .github/workflows/atlas-patch.yml, dispatched by @%s.\n\n' "${{ github.actor }}"
            printf 'Files:\n\n'
            git diff --stat | sed 's/^/    /'
            printf '\nRun: %s/%s/actions/runs/%s\n' \
              "${{ github.server_url }}" "${{ github.repository }}" "${{ github.run_id }}"
          } > /tmp/msg
          cat /tmp/msg
          branch="atlas-patch/$(date -u +%Y%m%d-%H%M)"
          git config user.name  'Ashley Cho'
          git config user.email 'ashleyeuncho@gmail.com'
          git switch -c "$branch"
          git add -A
          git commit -F /tmp/msg
          git push -u origin "$branch"
          gh pr create --base main --head "$branch" \
            --title "$(head -1 /tmp/msg)" --body-file /tmp/msg
